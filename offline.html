<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1A2421" />
  <title>Offline | Fantasy Front Office</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#111817; color:#F1F4F2; font:16px/1.6 system-ui,sans-serif; }
    main { max-width:420px; }
    h1 { font-size:26px; line-height:1.25; }
    p { color:#B0BDB6; }
    a { display:inline-flex; align-items:center; min-height:44px; padding:8px 16px; border-radius:8px; background:#46D0AE; color:#111817; font-weight:700; text-decoration:none; }
    a:focus-visible { outline:2px solid #F1F4F2; outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Connect to the internet to load your league, scores, and recommendations. Saved plans stay in this device's browser storage, but this screen does not show cached advice as current.</p>
    <a href="/">Open Fantasy Front Office</a>
  </main>
</body>
</html>
