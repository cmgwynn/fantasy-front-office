          const standing = FFOGameday.computeStanding([{ id: 1, wins: 6, losses: 1, ties: 0, pf: 900 }, { id: 2, wins: 5, losses: 2, ties: 0, pf: 950 }, { id: 3, wins: 3, losses: 4, ties: 0, pf: 800 }, { id: 4, wins: 2, losses: 5, ties: 0, pf: 990 }], 3, 2);
          check("Tracked-league standing reports rank, PF rank and games back of the playoff line",
            standing.rank === 3 && standing.pfRank === 4 && standing.gap === 2 && FFOGameday.standingGapLabel(standing) === "2 GB of playoffs" &&
            FFOGameday.computeStanding([{ id: 1, wins: 6, losses: 1, ties: 0, pf: 1 }, { id: 2, wins: 4, losses: 3, ties: 0, pf: 1 }], 1, 1).gap === -2);
          playoffForecasts.delete(key);

        }

        {
          const saved = { league: state.activeLeague, managers: state.managers, week: state.week, matchups: state.currentMatchups,
            sosWindow: state.sosWindowMode, snapshot: state.workspaceSnapshot,
            team: document.getElementById("teamSelect").innerHTML, teamValue: document.getElementById("teamSelect").value,
            simA: document.getElementById("simTeamA").innerHTML, simB: document.getElementById("simTeamB").innerHTML };
          const fixtureIds = ["fx_sim_qb1", "fx_sim_qb2", "fx_sim_qb3", "fx_sim_qb4"];
          const team = ["NO", "LV", "NYG", "TEN"];
          fixtureIds.forEach((id, index) => { state.players[id] = { id, name: `Sim QB ${index + 1}`, position: "QB", team: team[index], projectedPoints: [10, 20, 15, 5][index],
            seasonPpg: 12, baseValue: 100, posRank: index + 1, isCurrentNfl: true, injuryStatus: "Healthy" }; });
          state.workspaceSnapshot = "";
          state.week = 9;
          state.sosWindowMode = "NEXT4";
          state.activeLeague = { provider: "sleeper", leagueId: "sim-fixture", season: "2026", name: "Sim", rosterPositions: ["QB"], scoringSettings: { pass_td: 4 } };
          state.managers = [
            { rosterId: 1, teamName: "Alpha (alice)", players: ["fx_sim_qb1", "fx_sim_qb2"], starters: ["fx_sim_qb1"], reserve: [], taxi: [], wins: 5, losses: 2 },
            { rosterId: 2, teamName: "Bravo (bob)", players: ["fx_sim_qb4"], starters: ["fx_sim_qb4"], reserve: [], taxi: [], wins: 1, losses: 6 },
            { rosterId: 3, teamName: "Charlie (cy)", players: ["fx_sim_qb3"], starters: ["fx_sim_qb3"], reserve: [], taxi: [], wins: 3, losses: 4 }];
          state.currentMatchups = [{ roster_id: 1, matchup_id: 7, points: 0 }, { roster_id: 3, matchup_id: 7, points: 0 }, { roster_id: 2, matchup_id: 8, points: 0 }];
          const options = state.managers.map((manager, index) => `<option value="${index}">${manager.teamName}</option>`).join("");
          ["teamSelect", "simTeamA", "simTeamB"].forEach(id => { document.getElementById(id).innerHTML = options; });
          document.getElementById("simTeamA").value = "0";
          document.getElementById("simTeamB").value = "1";
          document.getElementById("simTeamA").dispatchEvent(new Event("change"));
          const pairedB = document.getElementById("simTeamB").value;
          const firstCard = document.querySelector("#simRows .sim-card");
          check("Matchup Simulator pairs the scheduled opponent, starts the best roster player and shows manager + record",
            pairedB === "2" && firstCard.textContent.includes("Sim QB 2") && firstCard.querySelector(".sim-tag")?.textContent === "Start" &&
            document.getElementById("simTeamHeadA").textContent.includes("alice · 5-2") &&
            document.getElementById("simScoreA").textContent.includes("+10.0 vs set lineup") &&
            document.getElementById("simWeek").value === "9");
          document.querySelector('[data-sim-lineup="set"]').click();
          const setFirst = document.querySelector("#simRows .sim-card").textContent;
          document.querySelector('[data-sim-lineup="optimal"]').click();
          check("Matchup Simulator Set lineups toggle compares the saved starters", setFirst.includes("Sim QB 1"));

          const savedSosCache = [9, 10, 11, 12].map(week => [`2026:${week}`, scheduleProjectionCache.get(`2026:${week}`)]);
          [9, 10, 11, 12].forEach(week => scheduleProjectionCache.set(`2026:${week}`, { values: { fx_sim_qb2: { pass_td: week - 8 } }, checkedAt: Date.now() }));
          document.getElementById("teamSelect").value = "0";
          document.getElementById("sosScope").value = "ROSTER";
          document.getElementById("sosPos").value = "QB";
          renderSosTab();
          const sosRow = [...document.querySelectorAll("#sosTable tbody tr")].find(row => row.textContent.includes("Sim QB 2"));
          const byeWeek = CURRENT_BYE_WEEKS.LV;
          const expected = [9, 10, 11, 12].filter(week => week !== byeWeek).map(week => (week - 8) * 4);
          check("Strength of Schedule player cells show each week's league-scored projection and the window total",
            sosRow && expected.every(value => sosRow.textContent.includes(`${value.toFixed(1)} proj pts`)) &&
            sosRow.querySelector(".sos-proj-total")?.textContent === `${expected.reduce((sum, value) => sum + value, 0).toFixed(1)} proj pts`);
          savedSosCache.forEach(([key, value]) => value ? scheduleProjectionCache.set(key, value) : scheduleProjectionCache.delete(key));
          document.getElementById("sosScope").value = "ALL";
          fixtureIds.forEach(id => delete state.players[id]);
          Object.assign(state, { activeLeague: saved.league, managers: saved.managers, week: saved.week, currentMatchups: saved.matchups, sosWindowMode: saved.sosWindow, workspaceSnapshot: saved.snapshot });
          document.getElementById("teamSelect").innerHTML = saved.team;
          document.getElementById("teamSelect").value = saved.teamValue;
          document.getElementById("simTeamA").innerHTML = saved.simA;
          document.getElementById("simTeamB").innerHTML = saved.simB;
          simTeamASelection = null;
          renderSosTab();
        }

        const connectionCopy = localStorage.getItem(CONNECTION_FIELDS_KEY);
        const accountSyncContext = {
          fetch: window.fetch, load: loadLeague, init: initApp, apply: applyWorkspaceSnapshot,
          sync: syncUserAccount, tab: activateTab, leagues: state.leagues, userId: state.userId,
          teamHtml: document.getElementById("teamSelect").innerHTML,
          teamDispatch: document.getElementById("teamSelect").dispatchEvent,
          leagueHtml: document.getElementById("leagueSelect").innerHTML,
          selection: localStorage.getItem(WORKSPACE_SELECTION_KEY)
        };
        const originalUrl = location.href;
        const providerCopy = document.getElementById("providerSelect").value;
        const accountCopy = document.getElementById("usernameInput").value;
        const stateProviderCopy = state.provider;
        try {
          history.replaceState(null, "", location.pathname);
          localStorage.removeItem(CONNECTION_FIELDS_KEY);
          document.getElementById("providerSelect").value = "sleeper";
          document.getElementById("usernameInput").value = "fixture-account";
          document.getElementById("usernameInput").dispatchEvent(new Event("input"));
          document.getElementById("providerSelect").value = "";
          document.getElementById("usernameInput").value = "";
          restoreConnectionInput(true);
          check("Account input and provider restore independently of league snapshots",
            document.getElementById("providerSelect").value === "sleeper" &&
            document.getElementById("usernameInput").value === "fixture-account");
          document.getElementById("providerSelect").value = "espn";
          document.getElementById("usernameInput").value = "123, 456";
          rememberConnectionFields();
          document.getElementById("providerSelect").value = "sleeper";
          restoreConnectionInput();
          check("Provider-specific account fields do not overwrite each other",
            document.getElementById("usernameInput").value === "fixture-account" &&
            readConnectionFields().accounts.espn === "123, 456");
          let loadedLeagueIndex = -1;
          const accountSeason = "2025";
          const accountLeague = { provider: "sleeper", leagueId: "saved-league", season: accountSeason };
          window.fetch = async url => {
            if (url.includes("/user/fixture-account")) return new Response(JSON.stringify({ user_id: "fixture-owner" }));
            if (url.endsWith(`/fixture-owner/leagues/nfl/${accountSeason}`)) return new Response(JSON.stringify([
              { name: "Other league", league_id: "other-league", season: accountSeason },
              { name: "Saved league", league_id: "saved-league", season: accountSeason }
            ]));
            throw new Error(`Unexpected account request: ${url}`);
          };
          loadLeague = async index => { loadedLeagueIndex = index; state.activeLeague = state.leagues[index]; };
          check("Reload account sync retrieves all leagues for the saved season and selects the exact league",
            await syncUserAccount({ leagueKey: getLeagueRecordsKey(accountLeague), season: accountSeason }) &&
            state.leagues.length === 2 && state.userId === "fixture-owner" &&
            loadedLeagueIndex === 1 && document.getElementById("leagueSelect").value === "1");
          document.getElementById("providerSelect").value = "espn";
          document.getElementById("usernameInput").value = "123, 456";
          const originalEspnFetch = fetchEspnLeague;
          try {
            fetchEspnLeague = async (leagueId, season) => ({
              seasonId: season, settings: { name: `League ${leagueId}` }, teams: []
            });
            check("ESPN reload sync restores all saved league IDs without switching to the first",
              await syncUserAccount({ leagueKey: getLeagueRecordsKey({ provider: "espn", leagueId: "456", season: accountSeason }), season: accountSeason }) &&
              state.leagues.length === 2 && loadedLeagueIndex === 1);
          } finally { fetchEspnLeague = originalEspnFetch; }
          document.getElementById("providerSelect").value = "sleeper";
          document.getElementById("usernameInput").value = "fixture-account";
          localStorage.removeItem(WORKSPACE_SELECTION_KEY);
          let resumeAccount = null, resumedTab = "", restoredCopies = 0;
          const reloadFixture = {
            snapshot: { provider: "sleeper", activeLeague: accountLeague, managers: [{ rosterId: "chosen-roster" }], week: 4 },
            ui: { teamIndex: 0, tab: "tab-compare" }
          };
          applyWorkspaceSnapshot = backup => {
            restoredCopies++;
            state.activeLeague = backup.snapshot.activeLeague;
            state.managers = backup.snapshot.managers;
            state.week = backup.snapshot.week;
            document.getElementById("teamSelect").innerHTML = '<option value="0">Chosen roster</option>';
          };
          initApp = async () => {};
          activateTab = tab => { resumedTab = tab; };
          document.getElementById("teamSelect").dispatchEvent = () => true;
          syncUserAccount = async options => { resumeAccount = options; return true; };
          await resumeReloadWorkspace(structuredClone(reloadFixture));
          check("Page reload automatically syncs the saved account and retains roster, week and destination",
            resumeAccount.leagueKey === getLeagueRecordsKey(accountLeague) && resumeAccount.season === accountSeason &&
            document.getElementById("teamSelect").value === "0" && state.week === 4 && resumedTab === "tab-compare");
          syncUserAccount = async () => { throw new Error("Account offline"); };
          await resumeReloadWorkspace(structuredClone(reloadFixture));
          check("Failed automatic account sync retains the saved view and explicitly warns",
            restoredCopies === 3 && !resumingReloadWorkspace &&
            document.getElementById("workspaceSnapshotBanner").textContent.includes("Account offline"));
          document.getElementById("usernameInput").value = "";
          rememberConnectionFields();
          restoreConnectionInput();
          check("Intentionally clearing a saved account field remains cleared", document.getElementById("usernameInput").value === "");
        } finally {
          window.fetch = accountSyncContext.fetch;
          loadLeague = accountSyncContext.load;
          initApp = accountSyncContext.init;
          applyWorkspaceSnapshot = accountSyncContext.apply;
          syncUserAccount = accountSyncContext.sync;
          activateTab = accountSyncContext.tab;
          state.leagues = accountSyncContext.leagues;
          state.userId = accountSyncContext.userId;
          document.getElementById("teamSelect").innerHTML = accountSyncContext.teamHtml;
          document.getElementById("teamSelect").dispatchEvent = accountSyncContext.teamDispatch;
          document.getElementById("leagueSelect").innerHTML = accountSyncContext.leagueHtml;
          if (accountSyncContext.selection === null) localStorage.removeItem(WORKSPACE_SELECTION_KEY);
          else localStorage.setItem(WORKSPACE_SELECTION_KEY, accountSyncContext.selection);
          state.activeLeague = claimLeague;
          history.replaceState(null, "", originalUrl);
          if (connectionCopy === null) localStorage.removeItem(CONNECTION_FIELDS_KEY);
          else localStorage.setItem(CONNECTION_FIELDS_KEY, connectionCopy);
          document.getElementById("providerSelect").value = providerCopy;
          document.getElementById("usernameInput").value = accountCopy;
          updateProviderControls();
          state.provider = stateProviderCopy;
        }

        const priorNewsletter = localStorage.getItem("fantasy-front-office:newsletter:v1");
        const newsletterLeague = { provider: "sleeper", leagueId: `newsletter-regression-${Date.now()}`, season: "2026" };
        const newsletterKey = getNewsletterLeagueKey(newsletterLeague);
        localStorage.setItem("fantasy-front-office:newsletter:v1", JSON.stringify({ [newsletterKey]: {
          "2026-week-4": { id: "2026-week-4", season: "2026", week: 4, standings: [{ teamName: "Faller" }, { teamName: "Mover" }] }
        } }));
        state.week = 5;
        const movement = getNewsletterStandingsMovement(newsletterLeague, [{ teamName: "Mover" }, { teamName: "Faller" }]);
        check("Newsletter standings movement uses saved issue", movement.movers.some(team => team.teamName === "Mover" && team.movement === 1));
        state.players.fixture_next_bye = { id: "fixture_next_bye", name: "Next Week Bye", position: "WR", team: "FA", projectedPoints: 5, seasonPpg: 5, isPick: false, byeWeek: 6, injuryStatus: "Healthy" };
        fixtureIds.push("fixture_next_bye");
        const nextWatch = buildNewsletterNextWeekWatch({ teamName: "Watch roster", players: ["fixture_next_bye"] });
        check("Newsletter previews next-week byes", nextWatch.some(line => line.includes("Next Week Bye") && line.includes("Week 6")));
        state.activeLeague = newsletterLeague;
        state.managers = [
          { rosterId: "1", teamName: "Zero heroes", wins: 1, losses: 0, pf: 0, pa: -2, players: [] },
          { rosterId: "2", teamName: "Negative scorers", wins: 0, losses: 1, pf: -2, pa: 0, players: [] }
        ];
        document.getElementById("teamSelect").innerHTML = '<option value="0">Zero heroes</option>';
        const recapKey = getLeagueRecordsKey(newsletterLeague);
        leagueRecordsCache.set(recapKey, { source: "Fixture final results", coverage: "One completed game.", errors: [],
          games: [{ week: 4, completed: true, homeId: "1", awayId: "2", homeScore: 0, awayScore: -2 }] });
        const recap = buildLeagueNewsletterIssue();
        check("Inbox recap uses up to three final-result highlights including zero/negative points, without repeating recommendations",
          recap.summary.length === 3 && recap.summary[0].includes("0.0 pts") &&
          recap.summary[1].includes("-2.0") && recap.summary[2].includes("outscored 1 of 1") &&
          recap.actions.length === 0 && recap.nextWeekWatch.length === 0 &&
          recap.games[0].week === 4 && recap.source.includes("Fixture final results"));
        renderNewsletterIssue(recap);
        check("Recap keeps full scores and standings collapsed and contains no duplicate action section",
          document.querySelectorAll("#leagueNewsletterContent .newsletter-brief li").length === 3 &&
          !document.querySelector("#leagueNewsletterContent details").open &&
          !document.getElementById("leagueNewsletterContent").textContent.includes("Front Office Watch"));
        check("Shared recap stays compact and identifies its source",
          newsletterIssueText(recap).includes("Fixture final results") &&
          !newsletterIssueText(recap).includes("FRONT OFFICE WATCH"));
        leagueRecordsCache.delete(recapKey);
        const emptyRecap = buildLeagueNewsletterIssue();
        check("Missing final results produce an explicit unavailable message, not generated filler",
          emptyRecap.games.length === 0 && emptyRecap.summary.length === 1 &&
          emptyRecap.summary[0].includes("No completed results") && emptyRecap.coverageLabel.includes("No completed scores"));
        activateTab("tab-newsletter");
        check("Old newsletter shortcuts lead to the integrated Inbox recap",
          document.getElementById("tab-inbox").classList.contains("active") && document.getElementById("inboxRecap").open);
        document.getElementById("inboxRecap").open = false;
        if (priorNewsletter === null) localStorage.removeItem("fantasy-front-office:newsletter:v1");
        else localStorage.setItem("fantasy-front-office:newsletter:v1", priorNewsletter);
      } finally {
        playoffForecasts.clear();
        savedForecasts.forEach((value, key) => playoffForecasts.set(key, value));
        careerHistoryCache.clear();
        savedCareerCache.forEach((value, key) => careerHistoryCache.set(key, value));
        plannerScheduleSources.clear();
        savedPlannerSchedules.forEach((value, key) => plannerScheduleSources.set(key, value));
        leagueRecordsCache.clear();
        savedRecordsCache.forEach((value, key) => leagueRecordsCache.set(key, value));
        draftState.adpByName = savedDraftAdp;
        state.activeLeague = savedLeague;
        state.leagues = savedLeagues;
        state.managers = savedManagers;
        state.waiverTargets = savedWaiverTargets;
        state.dbTrades = savedDbTrades;
        document.getElementById("teamSelect").value = savedTeamIndex;
        Object.entries(savedCompareControls).forEach(([id, value]) => { document.getElementById(id).value = value; });
        renderPlayerComparison();
        renderTeamGrades();
        renderLeagueRecords();
        renderRosterPlanner();
        Object.entries(savedPlannerControls).forEach(([id, value]) => { document.getElementById(id).value = value; });
        document.getElementById("plannerHoldInjuries").checked = savedPlannerInjuryToggle;
        if (savedActiveTab) activateTab(savedActiveTab);
        state.week = savedWeek;
        state.weekSelectionExplicit = savedWeekExplicit;
        state.season = savedSeason;
        state.currentNflWeek = savedCurrentNflWeek;
        state.currentNflSelection = savedCurrentNflSelection;
        renderCurrentWeekLabel();
        document.getElementById("weekSelect").value = String(savedWeek);
        state.dataFreshness.season = savedSeasonFreshness;
        if (savedSeasonError === undefined) delete state.dataErrors.season;
        else state.dataErrors.season = savedSeasonError;
        state.gameDayByTeam = savedGameDayByTeam;
        state.gameDayScheduleAvailable = savedGameDayScheduleAvailable;
        state.livePlayerPoints = savedLivePlayerPoints;
        state.dataFreshness.projections = savedProjectionFreshness;
        if (savedProjectionError === undefined) delete state.dataErrors.projections;
        else state.dataErrors.projections = savedProjectionError;
        state.dataFreshness.schedule = savedScheduleFreshness;
        if (savedScheduleError === undefined) delete state.dataErrors.schedule;
        else state.dataErrors.schedule = savedScheduleError;
        state.dataFreshness = savedAllFreshness;
        state.dataErrors = savedAllErrors;
        state.leagueCheckedKey = savedLeagueCheckedKey;
        renderDataFreshness();
        state.portfolioRosterSelections = savedPortfolioRosterSelections;
        Object.assign(faabState, savedFaabState);
        window.fetch = savedFetch;
        if (queuedPortfolioCacheKey) {
          if (savedQueuedPortfolioRosters === undefined) portfolioState.rostersByLeague.delete(queuedPortfolioCacheKey);
          else portfolioState.rostersByLeague.set(queuedPortfolioCacheKey, savedQueuedPortfolioRosters);
        }
        providerSelect.value = savedProvider;
        state.provider = savedStateProvider;
        document.getElementById("statusLabel").textContent = savedStatus;
        fixtureIds.forEach(id => { delete state.players[id]; });
        originalPlayers.forEach((player, id) => { state.players[id] = player; });
        if (savedNewsletterArchive === null) localStorage.removeItem("fantasy-front-office:newsletter:v1");
        else localStorage.setItem("fantasy-front-office:newsletter:v1", savedNewsletterArchive);
        state.players[`espn_${espnId}`] && delete state.players[`espn_${espnId}`];
        ESPN_PLAYER_TO_INTERNAL_ID.delete(espnId);
      }
      return results;
    }
    const frame = document.getElementById("appFrame");
    const summary = document.getElementById("summary");
    const resultList = document.getElementById("results");
    frame.addEventListener("load", async () => {
      try {
        await new Promise((resolve, reject) => {
          const deadline = Date.now() + 30000;
          const waitForReady = () => {
            const status = frame.contentDocument?.getElementById("statusLabel")?.textContent || "";
            if (status.startsWith("Ready |") || status.startsWith("Player database unavailable.")) resolve();
            else if (Date.now() >= deadline) reject(new Error("Timed out waiting for the app to finish initializing."));
            else setTimeout(waitForReady, 100);
          };
          waitForReady();
        });
        const results = await frame.contentWindow.eval(`(${runOptimizerFixtures.toString()})()`);
        const failures = results.filter(result => !result.passed);
        resultList.innerHTML = results.map(result => `<li class="${result.passed ? "pass" : "fail"}"><strong>${result.passed ? "PASS" : "FAIL"}</strong> ${result.name}${result.detail ? `: ${result.detail}` : ""}</li>`).join("");
        summary.textContent = failures.length ? `${failures.length} of ${results.length} checks failed.` : `${results.length} checks passed.`;
        summary.className = failures.length ? "fail" : "pass";
      } catch (error) {
        console.error("Regression harness failed:", error);
        summary.textContent = `Harness failed: ${error.message}`;
        summary.className = "fail";
      }
    }, { once: true });
  </script>
