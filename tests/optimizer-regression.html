    async function runOptimizerFixtures() {

          id, name, position, team: "FA", projectedPoints: score, seasonPpg: score,

      const check = (name, passed, detail) => results.push({ name, passed: Boolean(passed), detail: detail || "" });
      try {
        const connection = document.getElementById("connectionSettings");
        const initialConnectionOpen = connection.open;
        const initialConnectionState = connection.dataset.connectionState;
        const initialLeagueOpen = document.querySelector(".league-section").open;
        try {
          state.activeLeague = null; state.managers = [];

            document.getElementById("connectionSettingsLabel").textContent === "Connect a league");

        }
        for (const compact of [false, true]) {
          const plot = { l: 68, t: 28, w: compact ? 200 : 900, h: 284 };
          const points = Array.from({ length: 32 }, (_, rank) => ({ x: plot.l + plot.w / 2, y: 170, rank }));
          const markers = layoutAnalyticsMarkers(points, plot, compact);
          check(`Analytics logos do not overlap at coincident data points (${compact ? "phone" : "desktop"})`,
            markers.every((marker, index) => markers.slice(index + 1).every(other =>
              Math.hypot(marker.markerX - other.markerX, marker.markerY - other.markerY) >= marker.radius + other.radius + 3)));
          check(`Analytics logos stay within plot bounds and retain exact data coordinates (${compact ? "phone" : "desktop"})`,
            markers.every(marker => marker.markerX - marker.radius >= plot.l && marker.markerX + marker.radius <= plot.l + plot.w &&
              marker.markerY - marker.radius >= plot.t && marker.markerY + marker.radius <= plot.t + plot.h &&
              marker.x === plot.l + plot.w / 2 && marker.y === 170));

        check("Initial navigation and content open on GM Inbox",
          document.querySelector(".nav-btn.active")?.dataset.tab === "tab-inbox" &&
          document.querySelector(".tab-page.active")?.id === "tab-inbox" &&

        const navMobile = document.getElementById("mobileTabSelect");

        check("Inbox is a direct destination and closes unrelated navigation groups",

        check("Draft is a direct destination with synchronized mobile navigation",
          !document.querySelector('.nav-btn[data-tab="tab-draft"]').closest("details") &&
          document.getElementById("mobileTabSelect").value === "tab-draft");
        activateTab(savedTabId);
        {
          const scheduleManagers = [{ rosterId: 1, teamName: "Team A" }, { rosterId: 2, teamName: "Team B" }, { rosterId: 3, teamName: "Team C" }];
          const paired = normalizeLeagueSchedule({ provider: "sleeper" }, [
            { roster_id: 1, matchup_id: 7 }, { roster_id: 2, matchup_id: 7 }, { roster_id: 3, matchup_id: null }
          ], 8, scheduleManagers);
          check("League schedule pairs Sleeper teams and preserves an explicitly unpaired roster",
            paired.games.length === 2 && paired.games.some(game => game.homeId === "1" && game.awayId === "2") &&
            paired.games.some(game => game.homeId === "3" && game.awayId === null) && paired.issues.length === 0);
          const unresolved = normalizeLeagueSchedule({ provider: "sleeper" }, [
            { roster_id: 1, matchup_id: 7 }, { roster_id: 2, matchup_id: 7 }, { roster_id: 3, matchup_id: 7 }
          ], 8, scheduleManagers);
          check("League schedule does not invent pairings from ambiguous or incomplete groups",
            unresolved.games.length === 0 && unresolved.issues.length > 0);
          const espnScheduleLeague = { provider: "espn", espnData: { settings: { scheduleSettings: { matchupPeriods: { 3: [8, 9], 4: [10] } } } } };
          const espnPair = normalizeLeagueSchedule(espnScheduleLeague, [
            { matchupPeriodId: 3, home: { teamId: 1 }, away: { teamId: 2 } },
            { matchupPeriodId: 4, home: { teamId: 2 }, away: { teamId: 3 } }
          ], 8, scheduleManagers);
          check("ESPN schedule maps scoring weeks rather than assuming matchup-period IDs are weeks",
            espnPair.games.length === 1 && espnPair.games[0].note.includes("Weeks 8, 9") &&
            espnPair.games[0].homeId === "1");
          let missingMapping = false;
          try { normalizeLeagueSchedule({ provider: "espn" }, [], 8, scheduleManagers); }
          catch (error) { missingMapping = error.message.includes("mapping"); }
          check("ESPN missing week mapping is an explicit schedule error", missingMapping);
          const priorScheduleLeague = state.activeLeague, priorScheduleManagers = state.managers;
          const priorScheduleSnapshot = state.workspaceSnapshot, priorScheduleWeek = state.week;
          const priorScheduleTeamOptions = document.getElementById("teamSelect").innerHTML;
          const priorScheduleFetch = window.fetch;
          try {
            state.activeLeague = { provider: "sleeper", leagueId: "schedule-fixture", season: "2026" };
            state.managers = scheduleManagers;
            state.workspaceSnapshot = "";
            state.week = 8;
            document.getElementById("teamSelect").innerHTML = '<option value="0">Team A</option>';
            let requests = 0;
            window.fetch = async () => { requests++; return { ok: true, json: async () => [
              { roster_id: 1, matchup_id: 7 }, { roster_id: 2, matchup_id: 7 }, { roster_id: 3, matchup_id: null }
            ] }; };
            await loadLeagueSchedule(true);
            check("League schedule loads provider pairings and selected-week controls",
              document.getElementById("leagueScheduleWeek").value === "8" &&
              document.querySelectorAll("#leagueScheduleResults tbody tr").length === 2 && requests === 1);
            document.getElementById("leagueScheduleScope").value = "mine";
            await loadLeagueSchedule();
            check("My-team schedule filters without refetching and still names the opponent",
              requests === 1 && document.querySelectorAll("#leagueScheduleResults tbody tr").length === 1 &&
              document.getElementById("leagueScheduleResults").textContent.includes("Team B"));
            window.fetch = async () => { throw new Error("Schedule fixture offline"); };
            await loadLeagueSchedule(true);
            check("Schedule failures are visible and do not leave stale pairings presented as current",
              document.getElementById("leagueScheduleStatus").textContent.includes("Schedule fixture offline") &&
              !document.getElementById("leagueScheduleResults").textContent);
            state.workspaceSnapshot = "fixture snapshot";
            await loadLeagueSchedule(true);
            check("Saved snapshots do not fetch or fabricate future league schedules",
              document.getElementById("leagueScheduleStatus").textContent.includes("snapshot") &&
              document.getElementById("leagueScheduleResults").textContent.includes("No published matchup"));
          } finally {
            state.activeLeague = priorScheduleLeague; state.managers = priorScheduleManagers;
            state.workspaceSnapshot = priorScheduleSnapshot; state.week = priorScheduleWeek;
            document.getElementById("teamSelect").innerHTML = priorScheduleTeamOptions;
            document.getElementById("leagueScheduleScope").value = "all";
            window.fetch = priorScheduleFetch;
            leagueScheduleCache.clear();
            leagueScheduleContext = "";
          }
        }
        window.fetch = async () => ({ ok: true, json: async () => ({ season: "2026", display_week: 8, week: 8 }) });
        const weekProviders = ["", "espn", "sleeper", "yahoo"];
        let providerWeeksCorrect = true;
        for (const provider of weekProviders) {
          state.provider = provider;
          state.week = 1;
          state.weekSelectionExplicit = false;
          await syncNflSeasonSelection();
          providerWeeksCorrect &&= state.week === 8 && state.currentNflWeek === 8 && document.getElementById("weekSelect").value === "8";
        }
        check("Current NFL week sync works before provider selection and for every provider", providerWeeksCorrect);
        state.week = 5;
        state.weekSelectionExplicit = true;
        await syncNflSeasonSelection();
        check("NFL week refresh preserves an explicit selected week while updating current week",
          state.week === 5 && state.currentNflWeek === 8 && document.getElementById("weekSelect").value === "5");
        check("Week links accept only complete integers from 1 through 18",
          parseNflWeek("8") === 8 && parseNflWeek("18") === 18 &&
          ["", "0", "19", "-1", "8junk", "1.5", null, "Infinity"].every(value => parseNflWeek(value) === null));
        window.fetch = async () => ({ ok: true, json: async () => ({ season: "2026", display_week: 99, week: 8 }) });
        state.weekSelectionExplicit = false;
        await syncNflSeasonSelection();
        check("NFL week sync falls back to a valid week field if display week is invalid", state.week === 8);
        window.fetch = async () => ({ ok: true, json: async () => ({ season: "2026", display_week: null, week: 0 }) });
        await syncNflSeasonSelection();
        check("Invalid NFL week status remains visible and does not replace selected data",
          state.week === 8 && state.dataErrors.season?.includes("season/week feed is invalid"));
        state.provider = savedStateProvider;
        window.fetch = savedFetch;
        const filterFixture = [
          { type: "Start / sit" }, { type: "Waiver" }, { type: "Trade fit" },
          { type: "Portfolio exposure" }, { type: "Portfolio roster gap" }
        ];
        check("GM Inbox action filters group recommendation types",
          filterGmRecommendations(filterFixture, "lineup").length === 1 &&
          filterGmRecommendations(filterFixture, "waivers").length === 2 &&
          filterGmRecommendations(filterFixture, "trade").length === 1 &&
          filterGmRecommendations(filterFixture, "portfolio").length === 1 &&
          filterGmRecommendations(filterFixture, "all").length === filterFixture.length);
        const crowdedInbox = [...Array.from({ length: 14 }, () => ({ type: "Start / sit" })), { type: "Waiver" }];
        check("Inbox filters before limiting cards so lower-priority categories remain reachable",
          selectGmInboxActions(crowdedInbox, "waivers", false).visible.length === 1 &&
          selectGmInboxActions(crowdedInbox, "all", false).visible.length === 3 &&
          selectGmInboxActions(crowdedInbox, "all", true).visible.length === 15);

          document.querySelectorAll("#tab-inbox > details.gm-secondary:not([open])").length === 4 &&

          !document.getElementById("tab-newsletter"));

          movePreview.querySelector("details [data-gm-state='dismissed']"));

        const closedKey = getGmRecommendationKey(closedMove);

          movePreview.querySelectorAll("[data-gm-feedback]").length === 2);

        check("Dismissed Inbox moves retain the reopen action",
          !movePreview.querySelector("[data-gm-open]") && movePreview.querySelector("[data-gm-state='open']"));
        const compactMove = { ...closedMove, shortTitle: "Receiver · IR", shortValue: "2 of 4 rosters" };
        movePreview.innerHTML = renderGmInboxAction(compactMove, false, {}, "layout-fixture", []);
        check("Concise Inbox labels preserve recommendation identity and full explanations",
          movePreview.querySelector("h3").textContent === "Receiver · IR" &&
          movePreview.querySelector(".gm-action-value").textContent === "2 of 4 rosters" &&
          movePreview.querySelector("details p").textContent === closedMove.detail &&
          getGmRecommendationKey(compactMove) === closedKey);
        check("Recommended moves appear before the game-day checklist",
          document.getElementById("gmInboxList").compareDocumentPosition(document.getElementById("gmChecklist")) & Node.DOCUMENT_POSITION_FOLLOWING);

        const beforePlannerLeague = state.activeLeague;
        const beforePlannerManagers = state.managers;
        const beforePlannerWeek = state.week;
        ["QB", "RB", "WR", "TE"].forEach((position, index) => addPlayer(`fixture_plan_${position}`, `Planner ${position}`, position, 10 + index));
        const planManager = { rosterId: "planner-test", teamName: "Planner fixture", players: ["fixture_plan_QB", "fixture_plan_RB", "fixture_plan_WR"], reserve: [], taxi: [] };
        state.activeLeague = { provider: "yahoo", leagueId: "planner-test", season: "2099", rosterPositions: ["QB", "RB", "FLEX", "BN"] };
        state.managers = [planManager];
        state.week = 8;
        let plan = buildRosterPlan(planManager);
        check("Multiweek planner marks missing schedules provisional rather than calling them byes",
          plan.rows[0].baseline.known === 0 && plan.rows[0].baseline.filled === 3 &&
          getPlannerAvailability(state.players.fixture_plan_QB, 8, true).kind === "unknown");
        state.activeLeague.rosterPositions = ["RB", "FLEX"];
        plan = buildRosterPlan({ ...planManager, players: ["fixture_plan_RB"] });
        check("Multiweek planner never counts one player in two starter slots", plan.rows[0].baseline.filled === 1 && plan.rows[0].baseline.gaps.length === 1);
        state.activeLeague.rosterPositions = ["QB", "RB", "FLEX"];
        state.players.fixture_plan_RB.importedPlanningBye = 9;
        plan = buildRosterPlan(planManager);
        check("Multiweek planner removes bye players only in the matching week",
          plan.rows[0].baseline.filled === 3 && plan.rows[1].baseline.filled === 2);
        renderInboxSchedule(planManager);
        check("Inbox schedule shows four weeks, bye names, gaps and unverified schedules without claiming confirmed coverage",
          document.querySelectorAll("#gmSchedule .schedule-week").length === 4 &&
          document.querySelectorAll("#gmSchedule .schedule-week.has-gap").length === 1 &&
          document.getElementById("gmSchedule").textContent.includes("Planner RB") &&
          document.getElementById("gmSchedule").textContent.includes("Verify schedule") &&
          !document.getElementById("gmSchedule").textContent.includes("Slots covered"));
        document.querySelector("#gmSchedule [data-gm-open]").click();
        check("Inbox coverage shortcut opens the actual planning tool", document.getElementById("tab-planner").classList.contains("active"));
        activateTab("tab-inbox");
        state.activeLeague.rosterPositions = ["QB", "FLEX", "FLEX"];
        plan = buildRosterPlan(planManager, { addId: "fixture_plan_TE", dropId: "fixture_plan_QB" });
        check("Multiweek add-drop can repair a FLEX gap while exposing a QB gap",
          plan.rows[0].proposed.gaps.includes("QB") && plan.rows[1].proposed.filled === 2 &&
          !plan.rows[1].proposed.gaps.includes("FLEX"));
        plan = buildRosterPlan(planManager, { addId: "fixture_plan_TE" });
        check("Multiweek free-slot addition improves only affected weeks",
          plan.rows[0].proposed.filled === 3 && plan.rows[1].baseline.filled === 2 && plan.rows[1].proposed.filled === 3);
        state.players.fixture_plan_QB.injuryStatus = "Out";
        const heldPlan = buildRosterPlan(planManager);
        const healthyPlan = buildRosterPlan(planManager, { holdInjuries: false });
        check("Multiweek injury exclusions are explicit and reversible",
          heldPlan.rows[0].baseline.filled === 2 && healthyPlan.rows[0].baseline.filled === 3);
        state.players.fixture_plan_QB.injuryStatus = "Questionable";
        check("Questionable players remain eligible with their current status visible", buildRosterPlan(planManager).rows[0].baseline.filled === 3);
        plan = buildRosterPlan({ ...planManager, reserve: ["fixture_plan_RB"], taxi: ["fixture_plan_WR"] });
        check("Multiweek planner excludes reserve and taxi players", plan.ids.length === 1 && plan.rows[0].baseline.filled === 1);
        check("Multiweek planner rejects missing players, invalid drops and drop-only scenarios",
          Boolean(buildRosterPlan({ ...planManager, players: ["missing_plan_player"] }).reason) &&
          Boolean(buildRosterPlan(planManager, { dropId: "fixture_plan_TE", addId: "fixture_plan_TE" }).reason) &&
          Boolean(buildRosterPlan(planManager, { dropId: "fixture_plan_QB" }).reason));
        state.managers.push({ players: ["fixture_plan_TE"] });
        check("Multiweek planner blocks additions owned by any league roster", Boolean(buildRosterPlan(planManager, { addId: "fixture_plan_TE" }).reason));
        state.managers.pop();
        state.players.fixture_plan_TE.isCurrentNfl = false;
        check("Multiweek planner excludes inactive NFL additions", Boolean(buildRosterPlan(planManager, { addId: "fixture_plan_TE" }).reason));
        state.players.fixture_plan_TE.isCurrentNfl = true;
        addPlayer("fixture_plan_alias", "Planner RB", "RB", 10);
        check("Multiweek planner blocks an owned player's duplicate provider alias", Boolean(buildRosterPlan(planManager, { addId: "fixture_plan_alias" }).reason));
        check("Multiweek planner deduplicates roster aliases before counting coverage",
          buildRosterPlan({ ...planManager, players: ["fixture_plan_RB", "fixture_plan_alias"] }).rows[0].baseline.filled === 1);
        state.players.fixture_plan_TE.importedLeagueKey = "yahoo:another-league:2099";
        check("Multiweek planner excludes stale imports from other leagues", Boolean(buildRosterPlan(planManager, { addId: "fixture_plan_TE" }).reason));
        delete state.players.fixture_plan_TE.importedLeagueKey;
        state.players.fixture_plan_TE.isDemo = true;
        check("Multiweek planner isolates fictional and real player pools", Boolean(buildRosterPlan(planManager, { addId: "fixture_plan_TE" }).reason));
        state.players.fixture_plan_TE.isDemo = false;
        state.week = 18;
        check("Multiweek windows stop at Week 18", buildRosterPlan(planManager, { weeks: 6 }).rows.length === 1);
        check("Multiweek planner rejects invalid windows", Boolean(buildRosterPlan(planManager, { weeks: 3 }).reason));
        state.week = 8;
        state.players.fixture_plan_QB.team = "KC";
        const plannerSchedule = { KC: {}, BUF: {} };
        for (let week = 1; week <= 18; week++) {
          if (week === 9) continue;
          plannerSchedule.KC[week] = { opp: "BUF", isHome: true };
          plannerSchedule.BUF[week] = { opp: "KC", isHome: false };
        }
        plannerScheduleSources.set("2099", { schedule: plannerSchedule, timestamp: Date.now() });
        check("Multiweek planner uses season-specific fetched schedules and reciprocal full-season byes",
          getPlannerAvailability(state.players.fixture_plan_QB, 8, true).kind === "game" &&
          getPlannerAvailability(state.players.fixture_plan_QB, 9, true).kind === "bye");
        delete plannerSchedule.KC[10];
