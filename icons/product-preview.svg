<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title description">
  <title id="title">Gameday interface illustration</title>
  <desc id="description">Two example league matchups with actual scores, projected finals, players remaining and a starter alert. Not live data.</desc>
  <rect width="800" height="360" rx="18" fill="#111817"/>
  <g font-family="Arial, sans-serif">
    <text x="26" y="40" fill="#f1f4f2" font-size="24" font-weight="700">Every matchup. One Gameday.</text>
    <text x="26" y="66" fill="#b0bdb6" font-size="14">Illustrative interface - not live scores</text>
    <g fill="#1a2421" stroke="#3b4d44">
      <rect x="26" y="88" width="360" height="178" rx="12"/>
      <rect x="404" y="88" width="370" height="178" rx="12"/>
    </g>
    <g fill="#46d0ae" font-size="14" font-weight="700">
      <text x="44" y="116">LEAGUE ONE</text><text x="422" y="116">LEAGUE TWO</text>
    </g>
    <g fill="#f1f4f2" font-size="17">
      <text x="44" y="151">Your team</text><text x="240" y="151">Opponent</text>
      <text x="422" y="151">Your team</text><text x="627" y="151">Opponent</text>
    </g>
    <g fill="#f1f4f2" font-size="30" font-weight="700">
      <text x="44" y="189">94.2</text><text x="240" y="189">88.6</text>
      <text x="422" y="189">71.5</text><text x="627" y="189">82.3</text>
    </g>
    <g fill="#b0bdb6" font-size="13">
      <text x="44" y="215">Projected final 118.4</text><text x="240" y="215">Final 110.2</text>
      <text x="44" y="242">3 yet to play</text><text x="240" y="242">2 yet to play</text>
      <text x="422" y="215">Projected final 109.8</text><text x="627" y="215">Final 103.1</text>
      <text x="422" y="242">4 yet to play</text><text x="627" y="242">2 yet to play</text>
    </g>
    <rect x="26" y="284" width="748" height="52" rx="10" fill="#24312c" stroke="#e9b95f"/>
    <text x="44" y="316" fill="#e9b95f" font-size="16">Starter alert: review an unavailable player before kickoff.</text>
  </g>
</svg>
